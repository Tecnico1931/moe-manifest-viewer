<app-tabs-container
  [viewerState]="viewerState"
  (setActiveTab)="selectActiveTab($event)"
  (updateTabs)="updateTabs($event)"
  *ngIf="
    viewerState.showMetrics ||
    viewerState.showCMCD ||
    viewerState.showPlayerConfig ||
    viewerState.segmentInspector.show ||
    viewerState.showStallDetector ||
    viewerState.showHlsIssues ||
    viewerState.showClip ||
    viewerState.showWhisperSubtitles ||
    viewerState.showBitrateAudit ||
    viewerState.showStartup ||
    viewerState.showLadderCheck ||
    viewerState.showAudioCompare ||
    viewerState.showCaptionCheck ||
    viewerState.showEdgeView ||
    viewerState.showVideo ||
    viewerState.showScteDisplay ||
    viewerState.showSubtitles
  "
>
  <app-tab *ngIf="viewerState.showMetrics" tabTitle="{{ tabName.METRICS }}">
    <div>
      <app-data
        [type]="type"
        [selectedPlayer]="selectedPlayer"
        [viewerState]="viewerState"
        [manifestUpdate$]="manifestUpdate$"
        [isOnlyViewer]="isOnlyViewer"
        [id]="id"
        (seek)="seekToObj($event)"
        (loadLevelRequest)="emitLoadLevelRequest($event)"
      ></app-data>
    </div>
  </app-tab>

  <app-tab *ngIf="viewerState.showCMCD" tabTitle="{{ tabName.CMCD }}">
    <div>
      <app-cmcd [viewerState]="viewerState"></app-cmcd>
    </div>
  </app-tab>

  <app-tab *ngIf="viewerState.showPlayerConfig" tabTitle="{{ tabName.PLAYERCONFIG }}">
    <div>
      <app-player-config [viewerState]="viewerState"></app-player-config>
    </div>
  </app-tab>

  <app-tab *ngIf="viewerState.segmentInspector.show" tabTitle="{{ tabName.SEGMENTINSPECTOR }}">
    <app-segment-inspector
      [url]="viewerState.segmentInspector.url"
      [manifest]="manifest"
      [viewerState]="viewerState"
    ></app-segment-inspector>
  </app-tab>

  <app-tab *ngIf="viewerState.showScteDisplay" tabTitle="{{ tabName.SCTEDISPLAY }}">
    <app-scte-display [viewerState]="viewerState"></app-scte-display>
  </app-tab>

  <app-tab *ngIf="viewerState.showStallDetector" tabTitle="{{ tabName.STALLDETECTOR }}">
    <app-stall-detector [viewerReset$]="viewerReset$" [manifestUpdate$]="manifestUpdate$" [viewerState]="viewerState"></app-stall-detector>
  </app-tab>

  <app-tab *ngIf="viewerState.showHlsIssues" tabTitle="{{ tabName.HLSISSUES }}">
    <app-hls-issues [viewerReset$]="viewerReset$" [manifestUpdate$]="manifestUpdate$" [viewerState]="viewerState"></app-hls-issues>
  </app-tab>

  <app-tab *ngIf="viewerState.showClip && viewerState.showVideo" tabTitle="{{ tabName.CLIP }}">
    <app-clip [viewerState]="viewerState"></app-clip>
  </app-tab>

  <app-tab *ngIf="viewerState.showWhisperSubtitles && viewerState.showVideo" tabTitle="{{ tabName.WHISPER }}">
    <app-whisper-subtitles [viewerState]="viewerState"></app-whisper-subtitles>
  </app-tab>

  <app-tab *ngIf="viewerState.showBitrateAudit" tabTitle="{{ tabName.BITRATEAUDIT }}">
    <app-bitrate-audit [viewerState]="viewerState"></app-bitrate-audit>
  </app-tab>

  <app-tab *ngIf="viewerState.showStartup" tabTitle="{{ tabName.STARTUP }}">
    <app-startup-waterfall [viewerState]="viewerState"></app-startup-waterfall>
  </app-tab>

  <app-tab *ngIf="viewerState.showLadderCheck" tabTitle="{{ tabName.LADDERCHECK }}">
    <app-ladder-check [viewerState]="viewerState"></app-ladder-check>
  </app-tab>

  <app-tab *ngIf="viewerState.showAudioCompare" tabTitle="{{ tabName.AUDIOCOMPARE }}">
    <app-audio-compare [viewerState]="viewerState"></app-audio-compare>
  </app-tab>

  <app-tab *ngIf="viewerState.showCaptionCheck" tabTitle="{{ tabName.CAPTIONCHECK }}">
    <app-caption-check [viewerState]="viewerState"></app-caption-check>
  </app-tab>

  <app-tab *ngIf="viewerState.showEdgeView" tabTitle="{{ tabName.EDGEVIEW }}">
    <app-edge-view [viewerState]="viewerState"></app-edge-view>
  </app-tab>

  <app-tab *ngIf="!useNative && viewerState.showPlayerLogs" tabTitle="{{ tabName.PLAYERLOGS }}">
    <div>
      <app-player-logs *ngIf="!useNative" [scrolling]="scrolling" [viewerState]="viewerState"></app-player-logs>
    </div>
  </app-tab>

  <app-tab *ngIf="viewerState.showSubtitles" tabTitle="{{ tabName.SUBTITLES }}">
    <app-subtitles-viewer [manifestUpdate$]="manifestUpdate$" [viewerState]="viewerState"></app-subtitles-viewer>
  </app-tab>
</app-tabs-container>
